<script>
  // Se utiliza el mismo servidor de FastAPI que entrega esta página.
  const API_URL = "";

  const $ = id => document.getElementById(id);

  // Usuario autenticado actualmente.
  let currentUserId = null;

  // Firebase expondrá esta función para obtener el token.
  window.novaGetIdToken = null;

  // Datos locales del usuario actual.
  let tasks = [];
  let notes = [];

  // =========================================================
  // ALMACENAMIENTO SEPARADO POR USUARIO
  // =========================================================

  function storageKey(key) {
    if (!currentUserId) {
      return null;
    }

    return `nova_${currentUserId}_${key}`;
  }

  function read(key, fallback) {
    const finalKey = storageKey(key);

    if (!finalKey) {
      return fallback;
    }

    try {
      return JSON.parse(localStorage.getItem(finalKey)) ?? fallback;
    } catch (error) {
      console.error("No se pudieron leer los datos locales.", error);
      return fallback;
    }
  }

  function save(key, value) {
    const finalKey = storageKey(key);

    if (!finalKey) {
      return;
    }

    try {
      localStorage.setItem(finalKey, JSON.stringify(value));
    } catch (error) {
      console.error("No se pudieron guardar los datos localmente.", error);
    }
  }

  // =========================================================
  // CAMBIO DE USUARIO
  // =========================================================

  window.novaSetUser = function (uid) {
    // Si no hay usuario autenticado, se limpian los datos en memoria.
    currentUserId = uid || null;

    if (!currentUserId) {
      tasks = [];
      notes = [];

      $("chat").replaceChildren();
      $("chat2").replaceChildren();

      renderTasks();
      renderNotes();

      return;
    }

    // Cargar exclusivamente los datos del usuario autenticado.
    tasks = read("tasks", []);
    notes = read("notes", []);

    // Limpiar conversaciones visibles para evitar mezclar sesiones.
    $("chat").replaceChildren();
    $("chat2").replaceChildren();

    addBubble(
      $("chat"),
      "¡Hola! Soy NOVA. ¿Qué te gustaría aprender o resolver hoy?",
      "bot"
    );

    addBubble(
      $("chat2"),
      "Estoy listo para ayudarte con tus estudios y proyectos.",
      "bot"
    );

    renderTasks();
    renderNotes();
  };

  // =========================================================
  // NAVEGACIÓN ENTRE SECCIONES
  // =========================================================

  document.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      const page = button.dataset.page;

      document.querySelectorAll(".section").forEach(section => {
        section.classList.toggle("active", section.id === page);
      });

      document.querySelectorAll(".nav[data-page]").forEach(nav => {
        nav.classList.toggle("active", nav.dataset.page === page);
      });

      $("pageTitle").textContent = {
        inicio: "Panel de estudiante",
        asistente: "Asistente IA",
        tareas: "Mis tareas",
        notas: "Mis notas"
      }[page] || "NOVA";

      renderTasks();
      renderNotes();
    });
  });

  // =========================================================
  // ESTADO DE CONEXIÓN CON EL BACKEND
  // =========================================================

  async function checkConnection() {
    try {
      const response = await fetch(API_URL + "/health");

      if (!response.ok) {
        throw new Error("Backend no disponible");
      }

      $("connectionStatus").textContent = "● NOVA EN LÍNEA";
    } catch (error) {
      $("connectionStatus").textContent = "● SIN CONEXIÓN";
    }
  }

  // =========================================================
  // BURBUJAS DEL CHAT
  // =========================================================

  function addBubble(container, text, type) {
    const bubble = document.createElement("div");

    bubble.className = "bubble " + type;
    bubble.textContent = text;

    container.appendChild(bubble);
    container.scrollTop = container.scrollHeight;

    return bubble;
  }

  // =========================================================
  // CHAT CON FIREBASE Y FASTAPI
  // =========================================================

  async function sendMessage(inputId, chatId, buttonId) {
    const input = $(inputId);
    const button = $(buttonId);
    const message = input.value.trim();

    if (!message || button.disabled) {
      return;
    }

    // No permitir enviar mensajes sin usuario autenticado.
    if (!currentUserId) {
      alert("Inicia sesión para poder hablar con NOVA.");
      return;
    }

    const chat = $(chatId);

    addBubble(chat, message, "user");

    input.value = "";

    button.disabled = true;
    button.textContent = "...";

    const waiting = addBubble(
      chat,
      "NOVA está pensando...",
      "bot"
    );

    try {
      // Comprobar que Firebase ya proporcionó la función del token.
      if (typeof window.novaGetIdToken !== "function") {
        throw new Error("Firebase todavía no ha iniciado sesión.");
      }

      // Obtener el token del usuario autenticado.
      const token = await window.novaGetIdToken();

      if (!token) {
        throw new Error("No se pudo obtener el token de autenticación.");
      }

      // Enviar el mensaje junto con el token de Firebase.
      const response = await fetch(API_URL + "/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },

        body: JSON.stringify({
          mensaje: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.detail || "No se pudo procesar el mensaje."
        );
      }

      waiting.textContent =
        data.respuesta ?? "NOVA no devolvió una respuesta.";

      $("voiceStatus").textContent = "RESPUESTA RECIBIDA";

    } catch (error) {
      waiting.textContent =
        "No pude conectar con NOVA. Comprueba tu sesión e inténtalo de nuevo.";

      $("voiceStatus").textContent = "ERROR DE CONEXIÓN";

      console.error("Error al enviar mensaje:", error);

    } finally {
      button.disabled = false;
      button.textContent = "Enviar";

      input.focus();
    }
  }

  // Formularios de chat.
  $("chatForm").addEventListener("submit", event => {
    event.preventDefault();

    sendMessage("message", "chat", "sendBtn");
  });

  $("chatForm2").addEventListener("submit", event => {
    event.preventDefault();

    sendMessage("message2", "chat2", "sendBtn2");
  });

  // =========================================================
  // RECONOCIMIENTO DE VOZ DEL NAVEGADOR
  // =========================================================

  function activarMicrofono(inputId, buttonId) {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    const button = $(buttonId);
    const input = $(inputId);

    if (!SpeechRecognition) {
      $("voiceStatus").textContent = "VOZ NO DISPONIBLE";

      alert(
        "Este navegador no admite reconocimiento de voz. Prueba con Chrome."
      );

      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "es-MX";
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      button.classList.add("listening");

      $("voiceBars").classList.remove("idle");
      $("voiceBars").classList.add("listening");

      $("voiceStatus").textContent = "ESCUCHANDO...";
    };

    recognition.onresult = event => {
      let text = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        text += event.results[i][0].transcript;
      }

      input.value = text;
    };

    recognition.onerror = event => {
      $("voiceStatus").textContent =
        event.error === "not-allowed"
          ? "PERMISO DE MICRÓFONO DENEGADO"
          : "ERROR DE RECONOCIMIENTO";
    };

    recognition.onend = () => {
      button.classList.remove("listening");

      $("voiceBars").classList.remove("listening");
      $("voiceBars").classList.add("idle");

      if ($("voiceStatus").textContent === "ESCUCHANDO...") {
        $("voiceStatus").textContent = "SISTEMA EN LÍNEA";
      }
    };

    try {
      recognition.start();
    } catch (error) {
      console.error(error);

      $("voiceStatus").textContent =
        "NO SE PUDO ACTIVAR EL MICRÓFONO";
    }
  }

  $("micBtn").addEventListener("click", () => {
    activarMicrofono("message", "micBtn");
  });

  $("micBtn2").addEventListener("click", () => {
    activarMicrofono("message2", "micBtn2");
  });

  // =========================================================
  // TAREAS
  // =========================================================

  function addTask(text) {
    if (!text || !currentUserId) {
      return;
    }

    tasks.unshift({
      id: Date.now() + Math.random(),
      text,
      done: false
    });

    save("tasks", tasks);

    renderTasks();
  }

  function renderTasks() {
    ["quickTasks", "allTasks"].forEach(id => {
      const list = $(id);

      if (!list) {
        return;
      }

      list.replaceChildren();

      const subset =
        id === "quickTasks"
          ? tasks.slice(0, 4)
          : tasks;

      if (!subset.length) {
        const empty = document.createElement("p");

        empty.className = "empty";

        empty.textContent =
          "Todavía no hay tareas. Agrega tu primera actividad.";

        list.appendChild(empty);
      }

      subset.forEach(task => {
        const item = document.createElement("div");

        item.className = "item" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        checkbox.setAttribute(
          "aria-label",
          "Marcar tarea como terminada"
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;

          save("tasks", tasks);

          renderTasks();
        });

        const label = document.createElement("span");

        label.textContent = task.text;

        const del = document.createElement("button");

        del.className = "delete";
        del.textContent = "×";

        del.setAttribute(
          "aria-label",
          "Eliminar tarea"
        );

        del.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);

          save("tasks", tasks);

          renderTasks();
        });

        item.append(checkbox, label, del);

        list.appendChild(item);
      });
    });
  }

  // Formulario de tareas rápidas.
  $("quickTaskForm").addEventListener("submit", event => {
    event.preventDefault();

    addTask($("quickTask").value.trim());

    $("quickTask").value = "";
  });

  // Formulario de tareas completas.
  $("taskForm").addEventListener("submit", event => {
    event.preventDefault();

    addTask($("taskInput").value.trim());

    $("taskInput").value = "";
  });

  // =========================================================
  // NOTAS
  // =========================================================

  function renderNotes() {
    const list = $("notesList");

    if (!list) {
      return;
    }

    list.replaceChildren();

    if (!notes.length) {
      const empty = document.createElement("p");

      empty.className = "empty";
      empty.textContent = "Todavía no hay notas guardadas.";

      list.appendChild(empty);
    }

    notes.forEach(note => {
      const item = document.createElement("div");

      item.className = "item";

      const content = document.createElement("span");

      const title = document.createElement("strong");

      title.textContent = note.title;

      const body = document.createElement("p");

      body.style.whiteSpace = "pre-wrap";
      body.textContent = note.body;

      content.append(title, body);

      const del = document.createElement("button");

      del.className = "delete";
      del.textContent = "×";

      del.setAttribute(
        "aria-label",
        "Eliminar nota"
      );

      del.addEventListener("click", () => {
        notes = notes.filter(n => n.id !== note.id);

        save("notes", notes);

        renderNotes();
      });

      item.append(content, del);

      list.appendChild(item);
    });
  }

  // Formulario para guardar notas.
  $("noteForm").addEventListener("submit", event => {
    event.preventDefault();

    if (!currentUserId) {
      alert("Inicia sesión para guardar tus notas.");
      return;
    }

    const title = $("noteTitle").value.trim();
    const body = $("noteBody").value.trim();

    if (!title && !body) {
      return;
    }

    notes.unshift({
      id: Date.now() + Math.random(),
      title,
      body
    });

    save("notes", notes);

    $("noteTitle").value = "";
    $("noteBody").value = "";

    renderNotes();
  });

  // =========================================================
  // INICIALIZACIÓN
  // =========================================================

  renderTasks();
  renderNotes();

  checkConnection();

  // Revisar la conexión cada 30 segundos.
  setInterval(checkConnection, 30000);
</script>
